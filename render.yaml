services:
  - type: web
    name: attendfr-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: bash build.sh
    startCommand: gunicorn attendance_fr.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: django.db.backends.mysql
      - key: DB_PORT
        value: "4000"
      - key: DB_USE_SSL
        value: "True"
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Render puts one proxy in front of the app; needed for correct per-IP login throttling
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Same value as PROXY_SECRET in Cloudflare Pages. Once set, login/refresh/logout only
      # work through the Pages Function (frontend/functions/), and X-Client-IP is trusted.
      - key: AUTH_PROXY_SECRET
        sync: false
      - key: JWT_ACCESS_MINUTES
        value: "15"
      # "true" = build.sh deletes the old public copies of face photos (irreversible).
      # Leave "false" until you've confirmed face photos load in the app after a deploy.
      - key: FACE_PHOTOS_DELETE_PUBLIC
        value: "false"
      - key: FACE_RECOGNITION_TOLERANCE
        value: "0.5"
      - key: LATE_THRESHOLD_MINUTES
        value: "15"
      # Set in the Render dashboard (sync: false = the blueprint never overwrites them).
      - key: DB_SSL_CA
        sync: false
      - key: FACE_CONSENSUS_FRAMES
        sync: false
      - key: FACE_MATCH_MARGIN
        sync: false
      - key: MIN_FACE_CONFIDENCE
        sync: false
      - key: TWO_FACTOR_KEY
        sync: false

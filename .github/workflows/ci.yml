# CI for every push and pull request.
# Render deploys main automatically once these checks pass
# (Render → Settings → Build & Deploy → Auto-Deploy: "After CI Checks Pass").
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tests use an in-memory SQLite DB and never touch TiDB or Cloudinary (see settings.py).
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps face-recognition==1.3.0

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test --noinput

  frontend:
    name: Frontend tests (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
